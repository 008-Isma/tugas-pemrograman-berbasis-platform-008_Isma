<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Mahasiswa - Ismawati ♡ (Utility First)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-[#ffe4ef] via-[#fff5f8] to-[#ffd6e7] text-[#8f4265] font-['Trebuchet_MS',Arial,sans-serif] min-h-screen flex justify-center items-center p-[35px_15px] m-0 max-[360px]:p-[20px_12px]">

    <div class="w-full max-w-[900px] text-center">
        <!-- Judul Utama -->
        <h1 class="text-[#d94f87] text-[36px] max-[360px]:text-[28px] font-bold m-0 mb-[10px]" style="text-shadow: 2px 3px 0 #ffc4dc;">♡ Profil Mahasiswa ♡</h1>
        <p class="text-[#b66a8b] text-[15px] m-0 mb-[28px]">Welcome to my little corner! 🌷</p>

        <!-- Kartu Profil -->
        <div class="w-full max-w-[360px] mx-auto p-[30px_24px] max-[360px]:p-[24px_16px] bg-white/90 border-[3px] border-[#ffc5dd] rounded-[28px] shadow-[0_12px_30px_rgba(216,91,143,0.18)] transition-all duration-300 hover:-translate-y-[6px] hover:shadow-[0_18px_35px_rgba(216,91,143,0.25)]">
            
            <!-- Foto Profil -->
            <img 
                class="w-[130px] h-[130px] max-[360px]:w-[110px] max-[360px]:h-[110px] object-cover rounded-full border-[5px] border-[#ffb6d2] p-[4px] bg-[#fff0f6] mx-auto mb-[12px]" 
                src="Foto Profile.jpeg" 
                alt="Foto Profil Ismawati"
            >

            <!-- Nama -->
            <h2 class="text-[#d94f87] text-[27px] max-[360px]:text-[23px] font-bold my-[8px]">Ismawati ♡</h2>

            <!-- NIM -->
            <div class="inline-block bg-[#fff0f6] text-[#a65378] px-[15px] py-[9px] rounded-[20px] my-[8px] mb-[22px] text-[14px] max-[360px]:text-[13px] font-medium">
                🎀 NIM: 2024520008
            </div>

            <!-- Tombol -->
            <br>
            <a href="#" class="inline-block px-[25px] py-[12px] bg-gradient-to-br from-[#ff8fbd] to-[#e75491] text-white font-bold no-underline rounded-[25px] transition-all duration-200 hover:from-[#f46ca5] hover:to-[#d83f82] hover:-translate-y-[2px] active:translate-y-[3px]" style="box-shadow: 0 5px 0 #cc477e;">
                ♡ Lihat Profil ♡
            </a>
        </div>

        <!-- Dekorasi -->
        <div class="mt-[22px] text-[#d94f87] text-[20px] tracking-[5px]">✿ ♡ ✧ ♡ ✿</div>

        <!-- Footer -->
        <p class="mt-[18px] text-[13px] text-[#b66a8b]">Made with love by Ismawati 💗</p>
    </div>

</body>
</html>
